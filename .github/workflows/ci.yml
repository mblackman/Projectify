name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build demo, empty, plugin, and readme
        run: npm run build

      - name: Upload plugin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: projectify-dist
          path: |
            docs/projectify.json
            docs/demo.html
            docs/empty.html
          retention-days: 14
